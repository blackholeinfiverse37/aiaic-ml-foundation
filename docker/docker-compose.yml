# AIAIC ML Foundation: the forecast service, run locally the way AIAIC runs it.
#
#   python scripts/package_forecast_release.py --from models/forecast_pilot     # fills models/release/
#   docker compose -f docker/docker-compose.yml up --build -d
#   curl http://127.0.0.1:8040/v1/ready                                          # {"ready": true, ...}
#
# Port 8040 is bound to 127.0.0.1 only. On the AIAIC VM the service has NO published port: AIAIC reaches it on the
# shared docker network as http://aiaic-ml:8000 (ML_PRICE_API_URL), and nothing else can.
#
# MongoDB is optional and OFF. It only mirrors training-run logs; the service never needs it. To start it:
#   docker compose -f docker/docker-compose.yml --profile mongo up -d

services:
  aiaic-ml:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aiaic-ml-foundation:${AIAIC_ML_TAG:-local}
    container_name: aiaic-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8000"
    environment:
      - AIAIC_LOG_LEVEL=INFO

  mongo:
    profiles: ["mongo"]
    image: mongo:7.0
    container_name: aiaic_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
